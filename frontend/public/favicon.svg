<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>ClassyFridge</title>
  <g stroke="#1E2A44" stroke-linecap="round" stroke-linejoin="round">
    <!-- feet -->
    <rect x="18" y="54" width="6" height="6" rx="2" fill="#1E2A44" stroke-width="0"/>
    <rect x="40" y="54" width="6" height="6" rx="2" fill="#1E2A44" stroke-width="0"/>
    <!-- fridge body -->
    <rect x="12" y="5" width="40" height="51" rx="10" fill="#FFF3DC" stroke-width="4"/>
    <!-- freezer divider -->
    <line x1="12" y1="20" x2="52" y2="20" stroke-width="4"/>
    <!-- handles -->
    <line x1="19" y1="10.5" x2="19" y2="14.5" stroke-width="4"/>
    <line x1="19" y1="26" x2="19" y2="33" stroke-width="4"/>
    <!-- mushroom stem -->
    <rect x="30" y="40" width="8" height="9" rx="2.5" fill="#FFF3DC" stroke-width="3"/>
    <!-- mushroom cap -->
    <path d="M24 41 A10 10 0 0 1 44 41 Z" fill="#D9542B" stroke-width="3"/>
  </g>
  <!-- cap spot -->
  <circle cx="34" cy="35.5" r="2.2" fill="#FFF3DC"/>
</svg>
